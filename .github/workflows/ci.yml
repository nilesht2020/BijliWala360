name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - name: Lint
        run: pnpm exec eslint apps/api/src apps/api/test apps/web/src packages/contracts/src
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Contracts tests
        run: pnpm --filter @skillconnect/contracts test
      - name: API unit tests
        run: pnpm --filter @skillconnect/api exec jest --selectProjects unit --coverage
      - name: API integration tests (in-memory MongoDB replica set)
        run: pnpm --filter @skillconnect/api test:int
      - name: Web tests
        run: pnpm --filter @skillconnect/web test
      - name: Build
        run: pnpm --filter @skillconnect/api build && pnpm --filter @skillconnect/web build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t skillconnect-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t skillconnect-web:ci .
      - name: Scan images (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: skillconnect-api:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
