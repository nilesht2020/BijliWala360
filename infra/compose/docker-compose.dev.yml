# Local development dependencies (DEVELOPMENT_PLAN §1.1).
# Usage: docker compose -f infra/compose/docker-compose.dev.yml up -d
# The API, worker and web app run on the host with hot reload (pnpm dev:api / dev:worker / dev:web).
name: bijliwala-dev

services:
  mongo:
    image: mongo:7.0.14
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initiates the single-node replica set on first start (transactions require a replica set).
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bijliwala
      MINIO_ROOT_PASSWORD: bijliwala-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bijliwala bijliwala-secret &&
      mc mb --ignore-existing local/bijliwala-private &&
      mc anonymous set none local/bijliwala-private &&
      mc admin config set local api cors_allow_origin='http://localhost:5173' || true"
    restart: "no"

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20
      start_period: 120s

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

volumes:
  mongo-data:
  redis-data:
  minio-data:
